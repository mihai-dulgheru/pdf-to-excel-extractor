<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#3B82F6"/>
            <stop offset="1" stop-color="#1E3A8A"/>
        </linearGradient>
    </defs>
    <rect x="16" y="16" width="480" height="480" rx="100" fill="url(#bg)"/>

    <!-- the invoice PDF: A4 proportions (170 x 240) -->
    <g transform="translate(48 136)">
        <path d="M0 20 Q0 0 20 0 H126 L170 44 V220 Q170 240 150 240 H20 Q0 240 0 220 Z" fill="#FFFFFF"/>
        <path d="M126 0 V44 H170 Z" fill="#BFDBFE"/>
        <rect x="22" y="66" width="90" height="11" rx="5.5" fill="#CBD5E1"/>
        <rect x="22" y="92" width="126" height="11" rx="5.5" fill="#CBD5E1"/>
        <rect x="22" y="118" width="104" height="11" rx="5.5" fill="#CBD5E1"/>
        <rect x="-10" y="168" width="140" height="52" rx="12" fill="#DC2626"/>
        <text x="60" y="206" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-weight="700" font-size="32"
              fill="#FFFFFF" text-anchor="middle">PDF
        </text>
    </g>

    <!-- the arrow -->
    <path d="M226 240 H250 V214 L284 256 L250 298 V272 H226 Z" fill="#FFFFFF"/>

    <!-- the spreadsheet: same A4 proportions -->
    <g transform="translate(292 136)">
        <rect x="0" y="0" width="170" height="240" rx="18" fill="#FFFFFF"/>
        <path d="M0 18 Q0 0 18 0 H152 Q170 0 170 18 V52 H0 Z" fill="#107C41"/>
        <rect x="0" y="52" width="170" height="4" fill="#0B5D31"/>
        <g stroke="#D1D5DB" stroke-width="3">
            <line x1="57" y1="56" x2="57" y2="240"/>
            <line x1="113" y1="56" x2="113" y2="240"/>
            <line x1="0" y1="108" x2="170" y2="108"/>
            <line x1="0" y1="160" x2="170" y2="160"/>
            <line x1="0" y1="212" x2="170" y2="212"/>
        </g>
        <rect x="63" y="62" width="44" height="40" rx="4" fill="#BBF7D0"/>
        <rect x="119" y="114" width="44" height="40" rx="4" fill="#BBF7D0"/>
        <rect x="6" y="166" width="44" height="40" rx="4" fill="#BBF7D0"/>
        <rect x="119" y="166" width="44" height="40" rx="4" fill="#86EFAC"/>
        <text x="85" y="38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-weight="700" font-size="28"
              fill="#FFFFFF" text-anchor="middle">XLSX
        </text>
    </g>
